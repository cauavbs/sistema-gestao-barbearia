{% extends "base.html" %}

{% block titulo %}Lembretes e Prazos - Barbearia{% endblock %}
{% block cabecalho %}Lembretes e Prazos{% endblock %}

{% block conteudo %}
<!-- Bloco 1: Adicionar Novo Lembrete -->
<section class="card full-width" style="border-top: 5px solid #1e3a8a;">
    <h2 style="color: #1e3a8a;">⏰ Agendar Novo Lembrete</h2>
    <form id="form-lembrete">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
            <div class="mb-3">
                <label for="data-lembrete">🗓️ Data Limite (Prazo):</label>
                <input type="date" id="data-lembrete" required>
            </div>

            <div class="mb-3">
                <label for="texto-lembrete">📝 O que precisa ser feito?</label>
                <input type="text" id="texto-lembrete" required placeholder="Ex: Pagar cadeira nova, Renovar aluguel...">
            </div>
        </div>

        <button type="submit" style="background-color: #1e3a8a; margin-top: 25px; padding: 15px; font-size: 1.1rem;">Salvar Lembrete ✔️</button>
    </form>
</section>

<!-- Bloco 2: Lista de Lembretes -->
<section class="card full-width">
    <h2>📌 Meus Lembretes</h2>

    <!-- Preenchido via fetch em js/lembrete.js -->
    <div id="lista-lembretes" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/lembrete.js') }}"></script>
{% endblock %}
